<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Holotique · Kart portföyü</title>
<meta name="description" content="TCG koleksiyonunu bir yatırım portföyü gibi izle: ham ve PSA fiyatları, fiyat geçmişi, kur etkisi ve grading hesabı.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* Layout: collector's terminal — portfolio chart up top, holdings ledger left, card dossier right. Boldness lives in one place: the holo foil edge on graded slabs. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#121A26; --muted:#5A6577; --faint:#8A94A6; --line:#DDE2EA;
  --accent:#2B47D6; --accent-ink:#FFFFFF; --accent-soft:#E5E9FC; --chart:#2B47D6; --chart-fill:rgba(43,71,214,.12);
  --good:#127A47; --good-soft:#E1F3E9; --bad:#B7322A; --bad-soft:#F9E4E2; --warn:#9A6200; --warn-soft:#FBEFD9;
  --foil:conic-gradient(from 210deg,#7AD3F0,#B79CF5,#F3A6C8,#F6D58A,#9BE3C4,#7AD3F0);
  --shadow:0 1px 2px rgba(18,26,38,.06),0 6px 20px rgba(18,26,38,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1018; --surface:#131A25; --surface-2:#18212E; --ink:#E8EDF4; --muted:#A0AABA; --faint:#6E7889; --line:#253041;
  --accent:#93A6FF; --accent-ink:#0B1018; --accent-soft:#1D2849; --chart:#93A6FF; --chart-fill:rgba(147,166,255,.14);
  --good:#5ACB8C; --good-soft:#123020; --bad:#F2897F; --bad-soft:#3A1B19; --warn:#E9B65A; --warn-soft:#33270F; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1018; --surface:#131A25; --surface-2:#18212E; --ink:#E8EDF4; --muted:#A0AABA; --faint:#6E7889; --line:#253041;
  --accent:#93A6FF; --accent-ink:#0B1018; --accent-soft:#1D2849; --chart:#93A6FF; --chart-fill:rgba(147,166,255,.14);
  --good:#5ACB8C; --good-soft:#123020; --bad:#F2897F; --bad-soft:#3A1B19; --warn:#E9B65A; --warn-soft:#33270F; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.btn{font:600 .88rem var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.quiet{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
input,select{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);font-weight:500;min-width:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0 3px,transparent 4px),repeating-radial-gradient(circle,transparent 0 5px,var(--line) 5px 6px);position:relative;overflow:hidden;border:1px solid var(--line)}
.mark::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 300deg,color-mix(in srgb,var(--accent) 55%,transparent) 360deg);animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mark::after{animation:none}}
.brand h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;gap:4px}
.nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.88rem;padding:6px 10px;border-radius:7px}
.nav a:hover{background:var(--surface)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;font:600 .78rem var(--f-mono);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ccy-fixed{font:600 .78rem var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:7px 9px}
.ccy{display:flex;align-items:center;gap:6px}
.who{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:.8rem}

/* auth */
.auth{max-width:440px;margin:56px auto 0;padding:28px;display:flex;flex-direction:column;gap:16px}
.auth h2{font-size:1.6rem;letter-spacing:-.01em}
.auth p{margin:0}
.auth form{display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.msg{font-size:.86rem;padding:10px 12px;border-radius:8px}
.msg.ok{background:var(--good-soft);color:var(--good)} .msg.err{background:var(--bad-soft);color:var(--bad)} .msg.info{background:var(--accent-soft);color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:.85rem;text-align:left}
.lock{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;margin-top:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.stats{padding:20px;display:flex;flex-direction:column;gap:16px}
.value-big{font-family:var(--f-display);font-weight:700;font-size:2.5rem;letter-spacing:-.02em;line-height:1.05}
.value-sec{font-size:.95rem;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;border-top:1px solid var(--line);padding-top:14px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-size:1.02rem;font-weight:500}
.kpi .s{font-size:.76rem;color:var(--muted)}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.mix span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.chartp{padding:16px 18px 10px;display:flex;flex-direction:column;min-width:0}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chart-head h2{font-size:1.02rem;font-weight:700}
.chart-box{position:relative;margin-top:8px;flex:1;min-height:220px}
.chart-box svg{display:block;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:500 .76rem var(--f-mono);padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s;z-index:2}
.tip.on{opacity:1}
.note{font-size:.8rem;color:var(--muted)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px;margin-top:16px;align-items:start}
.ledger{padding:6px 0 4px}
.ledger-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 8px;flex-wrap:wrap}
.ledger-head h2{font-size:1.02rem;font-weight:700}
.ledger-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ledger-tools select{width:auto;padding:6px 8px;font-size:.82rem}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px minmax(0,1.6fr) minmax(0,.9fr) minmax(0,.8fr);gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft)}
.thumb{width:52px;aspect-ratio:63/88;border-radius:5px;padding:2px;background:var(--line);max-width:100%}
.thumb.slab{background:var(--foil)}
.thumb img,.thumb .ph{width:100%;height:100%;object-fit:cover;border-radius:3px;display:block;background:var(--surface-2)}
.nm{font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{font-size:.78rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.chip{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.grade{border-color:transparent;background:var(--ink);color:var(--bg)}
.chip.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip.err{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.chip.info{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.px{text-align:right;min-width:0}
.px .a{font-weight:500}
.px .b{font-size:.78rem}
.pill{display:inline-block;padding:1px 6px;border-radius:5px;font-size:.78rem}
.pill.pos{background:var(--good-soft)} .pill.neg{background:var(--bad-soft)}
.ledger-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}

/* dossier */
.dossier{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);padding:18px;display:flex;flex-direction:column;gap:16px}
.d-top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:start}
.d-top .thumb{width:120px;border-radius:8px;padding:3px}
.d-top .thumb img,.d-top .thumb .ph{border-radius:6px}
.d-top h3{font-size:1.1rem;font-weight:700;line-height:1.2}
.d-price{font-family:var(--f-display);font-size:1.7rem;font-weight:700;margin-top:6px;line-height:1.1}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grades div{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0;border:1px solid transparent}
.grades div.mine{border-color:var(--accent)}
.grades .v{font-size:.86rem;white-space:nowrap}
.grades .c{font-size:.7rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:.84rem}
.facts span:nth-child(odd){color:var(--muted)}
.mini-chart{height:150px;position:relative}
.mini-chart svg{width:100%;height:100%;display:block}
.desk{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.desk h3{font-size:.98rem}
.desk .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.desk input{font:500 .88rem var(--f-mono);padding:6px 8px}
.desk input[readonly]{color:var(--muted)}
.verdict{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.verdict.go{background:var(--good-soft)} .verdict.no{background:var(--bad-soft)}
.verdict .big{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.84rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}

/* add / import */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.sheet .panel{width:100%;max-width:760px;padding:22px;display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font-size:1.2rem}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.span2{grid-column:span 2}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.preview{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.preview table{border-collapse:collapse;width:100%;min-width:640px;font-size:.8rem}
.preview th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:7px 9px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.preview td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.empty{padding:34px 24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty h2{font-size:1.4rem}
.empty .cta{display:flex;gap:10px;flex-wrap:wrap}
footer{margin-top:22px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}

.fbar{display:flex;align-items:center;gap:6px;margin-top:20px;overflow-x:auto;padding:2px 2px 6px;overscroll-behavior-x:contain}
.fbar>*{flex:none}
.ftab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.86rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;max-width:240px}
.ftab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftab b{font:500 .74rem var(--f-mono);color:var(--faint)}
.ftab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ftab[aria-pressed="true"] b{color:inherit;opacity:.7}
.ftab.new{border-style:dashed;color:var(--accent);background:transparent}
.fsub{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:4px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pick-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick-tools input[type=search]{flex:1 1 200px;width:auto}
.pick-tools select{width:auto}
.pick-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.pick-bar .linkbtn{font-size:.84rem}
.pick-list{border:1px solid var(--line);border-radius:10px;max-height:min(420px,50vh);overflow:auto}
.pick{display:grid;grid-template-columns:auto 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.pick:first-child{border-top:0}
.pick:hover{background:var(--surface-2)}
.pick input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.pick .thumb{width:40px}
.pick .nm{font-weight:600;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .sub{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .pr{font:500 .82rem var(--f-mono);text-align:right}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet-foot .grow{flex:1}
.stabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.stab{border:0;background:transparent;padding:10px 14px;font-weight:600;font-size:.92rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.stab b{font:500 .74rem var(--f-mono);color:var(--faint)}
.stab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stab.live b{color:var(--good)}
a.btn{text-decoration:none}
.chip.ok{border-color:transparent;background:var(--good-soft);color:var(--good)}
.wpick{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:center}
.wpick .thumb{width:60px}
.wres{display:flex;flex-direction:column;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.wres:empty{display:none}
.wres .note{padding:12px}
.wres .pick{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.wres .pick:hover{background:var(--surface-2)}
.wres .pick:last-child{border-bottom:0}
.mini{height:140px;position:relative}
.showp{margin-top:16px;padding:22px;display:flex;flex-direction:column;gap:18px}
.live-box{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:14px 16px;border-radius:10px;background:var(--good-soft)}
.live-url{display:block;font-size:.95rem;font-weight:600;color:var(--ink);word-break:break-all}
.vform{display:flex;flex-direction:column;gap:14px;max-width:560px}
.vform textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;font:inherit;color:inherit;resize:vertical}
.vform .btn{align-self:flex-start}
.slugbox{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);overflow:hidden}
.slugbox span{padding:8px 0 8px 10px;color:var(--muted);font-size:.82rem;white-space:nowrap;align-self:center}
.slugbox input{border:0;background:transparent;padding-left:2px}
.imgprev{display:flex}
.imgcanvas{width:100%;max-width:360px;height:auto;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow)}
.imgcanvas.story{max-width:270px}
.linkprev{display:block;font-size:.88rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;word-break:break-all}
.salebox{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2)}
.salef{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.salef[hidden]{display:none}

  }

  // ---------- Excel import ----------
  function nk(s){return String(s==null?'':s).toLowerCase().replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]/g,'');}
  var ALIAS={grade:['grade','derece','kondisyon','condition','psagrade'],cert:['psaid','cert','certno','sertifika','sertifikano','psano','psanumarasi','certnumber'],game:['tcgtype','game','oyun','tcg'],set:['series','set','seri','setadi','setname','expansion'],name:['pokemoncard','cardname','kartadi','kart','name','isim','ad'],language:['dil','language','lang'],number:['kod','cardnumber','number','numara','kartno','kartnumarasi','collectornumber'],cost:['alisfiyati','alis','cost','maliyet','buyprice','purchaseprice','fiyat','price'],bought:['alistarihi','tarih','date','purchasedate','bought','buydate'],qty:['adet','qty','quantity','miktar']};
  function detect(rows){
    for(var i=0;i<Math.min(rows.length,20);i++){var r=rows[i]||[],map={},hits=0;
      r.forEach(function(c,j){var k=nk(c);if(!k)return;for(var f in ALIAS){if(map[f]==null&&ALIAS[f].indexOf(k)>=0){map[f]=j;hits++;return;}}if(k==='card'){map._card=j;}});
      if(map._card!=null){var vals=rows.slice(i+1,i+8).map(function(x){return String((x||[])[map._card]||'')});var gradeLike=vals.filter(function(v){return /psa|bgs|cgc|ham|raw|ungraded/i.test(v)}).length>=Math.max(1,vals.filter(Boolean).length/2);
        if(gradeLike&&map.grade==null){map.grade=map._card;hits++;}else if(!gradeLike&&map.name==null){map.name=map._card;hits++;}}
      if(map.name!=null&&hits>=3)return {header:i,map:map};}
    return null;}
  function toISO(v){if(v==null||v==='')return null;if(v instanceof Date&&!isNaN(v))return new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())).toISOString().slice(0,10);if(typeof v==='number'&&v>20000&&v<80000){return new Date(Date.UTC(1899,11,30)+v*864e5).toISOString().slice(0,10);}var s=String(v).trim(),m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null;}
  function toNum(v){if(typeof v==='number')return v;var s=String(v==null?'':v).replace(/[^\d,.\-]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');var n=parseFloat(s);return isFinite(n)?n:null;}
  function normGrade(v){var s=String(v||'').trim(),m=s.match(/\b(PSA|BGS|CGC|SGC|TAG|ACE)\s*-?\s*(\d{1,2}(?:[.,]5)?)\b/i);if(m&&Number(m[2].replace(',','.'))<=10){var gg=m[1].toUpperCase()+' '+m[2].replace(',','.');if(m[2]==='10'&&/black\s*label|\bBL\b/i.test(s)&&gg==='BGS 10')return 'BGS 10 Black Label';if(m[2]==='10'&&/pristine|\bPRI\b/i.test(s))return gg+' Pristine';return gg;}if(!s||/ham|raw|ungraded/i.test(s))return 'Ham';return s;}
  function normGame(v){var k=nk(v);if(!k||k.indexOf('pokemon')>=0)return 'Pokemon';if(k.indexOf('onepiece')>=0)return 'One Piece';if(k.indexOf('magic')>=0||k==='mtg')return 'Magic';if(k.indexOf('yugioh')>=0)return 'Yu-Gi-Oh!';if(k.indexOf('lorcana')>=0)return 'Lorcana';if(k.indexOf('riftbound')>=0||k.indexOf('leagueoflegends')>=0)return 'Riftbound';return String(v).trim();}
  function parseRows(rows,det){var m=det.map,out=[],warn=[];
    rows.slice(det.header+1).forEach(function(r,i){r=r||[];var g=function(f){return m[f]!=null?r[m[f]]:null};var name=String(g('name')||'').trim();if(!name)return;
      var set=String(g('set')||'').trim(),langRaw=nk(g('language')),num=g('number');
      var row={game:normGame(g('game')),set_input:set||null,name_input:name,number_input:num==null||num===''?null:String(typeof num==='number'?Math.round(num):num).trim(),
        language:(/^(jp|ja|jpn|japanese|japonca)$/.test(langRaw)||(!langRaw&&/japanese/i.test(set)))?'japanese':'english',
        grade:normGrade(g('grade')),cert:g('cert')==null||g('cert')===''?null:String(typeof g('cert')==='number'?Math.round(g('cert')):g('cert')).trim(),
        qty:Math.max(1,parseInt(g('qty'),10)||1),cost_usd:toNum(g('cost'))||0,bought:toISO(g('bought'))};
      if(toNum(g('cost'))==null)warn.push('Satır '+(det.header+i+2)+': alış fiyatı yok, 0 kabul edildi.');
      if(!gradeKey(row.grade))warn.push('Satır '+(det.header+i+2)+': "'+row.grade+'" derecesi için fiyat yok.');
      out.push(row);});
    return {rows:out,warn:warn};}

  function openImport(){
    sheet('Excel’den içe aktar',function(p,close){
      var state={rows:[]},body=el('div',{style:'display:flex;flex-direction:column;gap:14px'});
      var file=el('input',{id:'xlsFile',type:'file',accept:'.xlsx,.xls,.csv',style:'max-width:320px'});
      var drop=el('div',{class:'drop'},[el('strong',{text:'Excel ya da CSV dosyanı seç'}),el('span',{class:'note',text:'Sütun adları ve sırası önemli değil: kart adı, set, numara, dil, derece, PSA numarası, adet, alış fiyatı (USD) ve alış tarihini otomatik tanırız.'}),file]);
      ['dragover','dragenter'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over');});});
      ['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over');});});
      drop.addEventListener('drop',function(e){if(e.dataTransfer.files[0])read(e.dataTransfer.files[0]);});
      file.addEventListener('change',function(){if(file.files[0])read(file.files[0]);});
      p.appendChild(drop);p.appendChild(body);
      function read(f){body.innerHTML='';if(!window.XLSX){body.appendChild(el('div',{class:'msg err',text:'Excel okuyucu yüklenemedi. Sayfayı yenileyip tekrar dene.'}));return;}
        var fr=new FileReader();fr.onload=function(){try{var wb=XLSX.read(fr.result,{type:'array',cellDates:false}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),det=detect(rows);
          if(!det){body.appendChild(el('div',{class:'msg err',text:'Kart adı sütunu bulunamadı. İlk satırda "Kart adı" ya da "Card name" gibi bir başlık olduğundan emin ol.'}));return;}
          var res=parseRows(rows,det),existing={};S.holdings.forEach(function(h){if(h.cert)existing[h.cert]=1;});
          var fresh=res.rows.filter(function(r){return !(r.cert&&existing[r.cert])}),dup=res.rows.length-fresh.length;state.rows=fresh;
          var tot=fresh.reduce(function(a,r){return a+r.cost_usd*r.qty},0);
          body.appendChild(el('div',{class:'msg ok',text:fresh.length+' kart bulundu · toplam maliyet '+usd(tot)+(dup?' · '+dup+' kart zaten portföyünde (PSA numarasına göre), atlanacak':'')}));
          var tb=el('tbody');fresh.slice(0,8).forEach(function(r){tb.appendChild(el('tr',null,[r.name_input,r.set_input||'—',r.number_input||'—',r.language==='japanese'?'JP':'EN',r.grade,r.cert||'—',String(r.qty),usd(r.cost_usd),r.bought||'—'].map(function(t){return el('td',{text:t})})));});
          body.appendChild(el('div',{class:'preview'},[el('table',null,[el('thead',null,[el('tr',null,['Kart','Set','No','Dil','Derece','PSA no','Adet','Alış','Tarih'].map(function(t){return el('th',{text:t})}))]),tb])]));
          if(fresh.length>8)body.appendChild(el('div',{class:'note',text:'İlk 8 satır gösteriliyor.'}));
          if(res.warn.length)body.appendChild(el('div',{class:'msg info',text:res.warn.slice(0,5).join(' ')+(res.warn.length>5?' (+'+(res.warn.length-5)+' uyarı)':'')}));
          body.appendChild(el('div',{class:'note',text:'Alış fiyatlarının USD olduğu varsayılır.'}));
          var go=el('button',{class:'btn',type:'button',text:fresh.length+' kartı içe aktar',disabled:!fresh.length});
          go.addEventListener('click',function(){go.disabled=true;go.textContent='Aktarılıyor…';var chunks=[];for(var i=0;i<state.rows.length;i+=100)chunks.push(state.rows.slice(i,i+100));
            chunks.reduce(function(pr,c){return pr.then(function(){return sb.from('holdings').insert(c).then(function(r){if(r.error)throw r.error;});});},Promise.resolve())
              .then(function(){close();load();}).catch(function(e){go.disabled=false;go.textContent='Tekrar dene';body.appendChild(el('div',{class:'msg err',text:'Aktarılamadı: '+(e.message||e)}));});});
          body.appendChild(go);
        }catch(e){body.appendChild(el('div',{class:'msg err',text:'Dosya okunamadı: '+(e.message||e)}));}};fr.readAsArrayBuffer(f);}
    });
  }

  // ---------- boot ----------
  document.getElementById('signOut').addEventListener('click',function(){sb.auth.signOut();});
  if(!sb){renderAuth(['err','Bağlantı kütüphanesi yüklenemedi. Sayfayı yenile.']);return;}
  var booted=false;
  sb.auth.onAuthStateChange(function(ev,session){var u=session&&session.user;if(u&&(!S.user||S.user.id!==u.id)){S.user=u;load();}else if(!u&&(S.user||!booted)){S.user=null;S.holdings=[];renderAuth(ev==='SIGNED_OUT'?['info','Çıkış yaptın.']:null);}booted=true;});
  var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(function(){if(S.user&&S.holdings.length)render();},150);});
})();
</script>

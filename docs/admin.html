    var graders=mix.filter(function(m){return m.dim==='grader'}).map(function(m){return {label:m.label,v:m.holdings,value:m.value}});
    var fmt=function(r){return n(r.v)+' kart · '+usd(r.value)};
    app.appendChild(el('section',{class:'section two'},[hbars('Oyuna göre portföyler',games,fmt),hbars('Derecelendirme şirketine göre',graders,fmt)]));
    var ms=o.match_status||{},cat=o.catalog_last||{},credits=Number(o.credits_today||0);
    var priceOk=o.last_price_date&&(Date.now()-Date.parse(o.last_price_date+'T00:00:00Z'))<2*864e5;
    var sys=el('div',{class:'sys'});
    [['Son fiyat günü',dfmt(o.last_price_date),priceOk?['ok','güncel']:['bad','gecikmiş']],
     ['Katalog',n(o.catalog_cards)+' kart',cat.source_updated?['ok','kaynak '+dfmt(cat.source_updated)]:null],
     ['Bugünkü PPT kredisi',n(credits)+' / 15.000',credits>12000?['warn','limite yakın']:['ok','yeterli']],
     ['Eşleşme bekleyen',n(ms.pending||0),(ms.pending||0)>0?['warn','sırada']:['ok','yok']],
     ['Bulunamayan kart',n(ms.failed||0),(ms.failed||0)>0?['warn','kontrol']:['ok','yok']],
     ['Desteklenmeyen',n(ms.unsupported||0),null]].forEach(function(x){
      sys.appendChild(el('div',null,[el('div',{class:'k',text:x[0]}),el('div',{class:'v'},[x[1]+' ',x[2]?el('span',{class:'chip '+x[2][0],text:x[2][1]}):null])]));});
    app.appendChild(el('section',{class:'section panel'},[el('div',{class:'card-h'},[el('h3',{text:'Sistem sağlığı'}),el('span',{text:'fiyat görevi 15 dakikada bir, katalog her gece'})]),sys]));
    app.appendChild(el('p',{class:'note',style:'margin-top:14px',text:'Arama ve görüntüleme sayıları 19 Ekim 2026\'dan itibaren tutuluyor; kimin aradığı kaydedilmez.'}));
  }

  renderRange();
  if(!sb){gate('Bağlantı kurulamadı','Sayfayı yenile.',null);return;}
  sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;
    if(!s)return gate('Giriş gerekli','Yönetim paneli için önce portföy sayfasından giriş yap.',['portfoy.html','Giriş yap']);
    load();});
})();
</script>

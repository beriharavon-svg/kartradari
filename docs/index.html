<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KartRadarı</title>
<meta name="description" content="TCG koleksiyonunu bir yatırım portföyü gibi izle: günlük piyasa fiyatı, fiyat geçmişi, kur etkisi ve grading hesabı.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: terminal-style collector desk — portfolio chart up top, holdings ledger left, card dossier right. Boldness lives in one place: the holo foil edge on each card thumbnail. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#121A26; --muted:#5A6577; --faint:#8A94A6; --line:#DDE2EA;
  --accent:#2B47D6; --accent-soft:#E5E9FC; --chart:#2B47D6; --chart-fill:rgba(43,71,214,.12);
  --good:#127A47; --good-soft:#E1F3E9; --bad:#B7322A; --bad-soft:#F9E4E2;
  --foil:conic-gradient(from 210deg,#7AD3F0,#B79CF5,#F3A6C8,#F6D58A,#9BE3C4,#7AD3F0);
  --shadow:0 1px 2px rgba(18,26,38,.06),0 6px 20px rgba(18,26,38,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1018; --surface:#131A25; --surface-2:#18212E; --ink:#E8EDF4; --muted:#A0AABA; --faint:#6E7889; --line:#253041;
  --accent:#93A6FF; --accent-soft:#1D2849; --chart:#93A6FF; --chart-fill:rgba(147,166,255,.14);
  --good:#5ACB8C; --good-soft:#123020; --bad:#F2897F; --bad-soft:#3A1B19; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1018; --surface:#131A25; --surface-2:#18212E; --ink:#E8EDF4; --muted:#A0AABA; --faint:#6E7889; --line:#253041;
  --accent:#93A6FF; --accent-soft:#1D2849; --chart:#93A6FF; --chart-fill:rgba(147,166,255,.14);
  --good:#5ACB8C; --good-soft:#123020; --bad:#F2897F; --bad-soft:#3A1B19; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0 3px,transparent 4px),repeating-radial-gradient(circle,transparent 0 5px,var(--line) 5px 6px);position:relative;overflow:hidden;border:1px solid var(--line)}
.mark::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 300deg,color-mix(in srgb,var(--accent) 55%,transparent) 360deg);animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mark::after{animation:none}}
.brand h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.fresh{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.fresh.stale i{background:#D49A1E}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;font:600 .78rem var(--f-mono);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ccy-fixed{font:600 .78rem var(--f-mono);background:var(--accent);color:#fff;border-radius:6px;padding:7px 9px}
.ccy{display:flex;align-items:center;gap:6px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;margin-top:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.stats{padding:20px;display:flex;flex-direction:column;gap:16px}
.value-big{font-family:var(--f-display);font-weight:700;font-size:2.5rem;letter-spacing:-.02em;line-height:1.05}
.value-sec{font-size:.95rem;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;border-top:1px solid var(--line);padding-top:14px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-size:1.02rem;font-weight:500}
.kpi .s{font-size:.78rem;color:var(--muted)}
.alloc{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.alloc span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.chartp{padding:16px 18px 10px;display:flex;flex-direction:column;min-width:0}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chart-head h2{font-size:1.02rem;font-weight:700}
.chart-box{position:relative;margin-top:8px;flex:1;min-height:220px}
.chart-box svg{display:block;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:500 .76rem var(--f-mono);padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.note{font-size:.8rem;color:var(--muted)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px;margin-top:16px;align-items:start}
.ledger{padding:6px 0 4px}
.ledger-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 8px;flex-wrap:wrap}
.ledger-head h2{font-size:1.02rem;font-weight:700}
.sort select{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.82rem}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px minmax(0,1.5fr) 92px minmax(0,.9fr) minmax(0,.8fr);gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft)}
.thumb{width:52px;aspect-ratio:63/88;border-radius:5px;padding:2px;background:var(--line);max-width:100%}
.thumb.holo{background:var(--foil)}
.thumb img,.thumb .ph{width:100%;height:100%;object-fit:cover;border-radius:3px;display:block;background:var(--surface-2)}
.nm{font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{font-size:.78rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.chip{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.game{border-color:transparent;color:#fff}
.spark{width:92px;height:32px}
.px{text-align:right;min-width:0}
.px .a{font-weight:500}
.px .b{font-size:.78rem}
.pill{display:inline-block;padding:1px 6px;border-radius:5px;font-size:.78rem}
.pill.pos{background:var(--good-soft)} .pill.neg{background:var(--bad-soft)}
.warn-row{padding:10px 18px;border-top:1px solid var(--line);font-size:.84rem;color:var(--bad)}
.ledger-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.84rem}
a{color:var(--accent)}

/* dossier */
.dossier{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);padding:18px;display:flex;flex-direction:column;gap:16px}
.d-top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:start}
.d-top .thumb{width:120px;border-radius:8px;padding:3px}
.d-top .thumb img,.d-top .thumb .ph{border-radius:6px}
.d-top h3{font-size:1.1rem;font-weight:700;line-height:1.2}
.d-price{font-family:var(--f-display);font-size:1.7rem;font-weight:700;margin-top:6px;line-height:1.1}
.d-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.d-grid div{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.d-grid .v{font-size:.92rem}
.mini-chart{height:150px;position:relative}
.mini-chart svg{width:100%;height:100%;display:block}
.desk{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.desk h3{font-size:.98rem}
.desk .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.desk label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);font-weight:500;min-width:0}
.desk input{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:500 .88rem var(--f-mono);width:100%;min-width:0}
.desk input[readonly]{color:var(--muted)}
.verdict{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.verdict.go{background:var(--good-soft)} .verdict.no{background:var(--bad-soft)}
.verdict .big{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.84rem}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.2rem;margin-bottom:6px}
footer{margin-top:22px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}

@media (max-width:980px){.main{grid-template-columns:1fr}.dossier{position:static}}
@media (max-width:760px){.hero{grid-template-columns:1fr}.row{grid-template-columns:44px minmax(0,1fr) minmax(0,auto);}.row .spark,.row .px.val{display:none}.thumb{width:44px}.value-big{font-size:2.1rem}}
@media (max-width:420px){.d-top{grid-template-columns:96px minmax(0,1fr)}.d-top .thumb{width:96px}.d-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>KartRadarı</h1></div>
    <span class="fresh" id="fresh"><i></i><span id="freshTxt">Veri yükleniyor</span></span>
    <div class="ccy" role="group" aria-label="İkinci para birimi">
      <span class="ccy-fixed" title="Ana fiyat her zaman USD">USD</span>
      <div class="seg" id="ccySeg"></div>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="panel empty" id="loading" style="margin-top:20px"><h2>Veriler yükleniyor</h2><p>Son günlük kayıt okunuyor.</p></div>
</main>

<script>
(function(){
  'use strict';
  var CCY=[{c:'TRY',s:'₺',d:0},{c:'EUR',s:'€',d:2},{c:'GBP',s:'£',d:2},{c:'JPY',s:'¥',d:0},{c:'CNY',s:'CN¥',d:0}];
  var GAME_COLORS={'Pokemon':'#D9961A','Magic':'#6E56CF','One Piece':'#CF4038','Yu-Gi-Oh!':'#2A8A97','Digimon':'#2F7BD0','Dragon Ball':'#E06A1E','Lorcana':'#8C4FB8','Spor':'#3C7B39'};
  var REPO_EDIT='https://github.com/beriharavon-svg/kartradari/edit/main/pipeline/portfolio.json';
  var MONTHS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  var S={ccy:store.get('kr-ccy')||'TRY',range:store.get('kr-range')||'all',sort:store.get('kr-sort')||'value',sel:null,latest:null,history:null};
  if(!CCY.some(function(m){return m.c===S.ccy})) S.ccy='TRY';

  function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='text')e.textContent=attrs[k];else if(k==='class')e.className=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e;}
  function meta(c){for(var i=0;i<CCY.length;i++)if(CCY[i].c===c)return CCY[i];return CCY[0];}
  function usd(v,sign){if(v==null||!isFinite(v))return '—';return (sign&&v>0?'+':'')+(v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function sec(v,sign,c){c=c||S.ccy;if(v==null||!isFinite(v))return '—';var m=meta(c);return (sign&&v>0?'+':'')+(v<0?'−':'')+m.s+Math.abs(v).toLocaleString('tr-TR',{minimumFractionDigits:m.d,maximumFractionDigits:m.d});}
  function pct(v){if(v==null||!isFinite(v))return '—';return (v>0?'+':'')+(v<0?'−':'')+Math.abs(v).toFixed(1)+'%';}
  function cls(v){return v>0?'pos':(v<0?'neg':'');}
  function dfmt(iso){if(!iso)return '—';var p=iso.slice(0,10).split('-');return Number(p[2])+' '+MONTHS[Number(p[1])-1]+' '+p[0];}
  function rateNow(){return S.latest&&S.latest.fx&&S.latest.fx.rates?Number(S.latest.fx.rates[S.ccy]):NaN;}
  function fxOn(date){var fx=(S.history&&S.history.fx)||[],best=null;for(var i=0;i<fx.length;i++){if(fx[i][0]<=date)best=fx[i][1];else break;}return best?Number(best[S.ccy]):rateNow();}

  function ok(h){return h.status==='ok'&&h.price&&h.price.market!=null;}
  function series(id){return (S.history&&S.history.prices&&S.history.prices[id])||[];}
  function changeOver(id,days){var s=series(id);if(s.length<2)return null;var last=s[s.length-1],t=new Date(last[0]+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-days);var cut=t.toISOString().slice(0,10),base=null;for(var i=s.length-1;i>=0;i--){if(s[i][0]<=cut){base=s[i][1];break;}}if(base==null)return null;return (last[1]-base)/base*100;}

  function totals(){var t={val:0,cost:0,fx:0,game:{}};S.latest.holdings.forEach(function(h){if(!ok(h))return;var v=h.price.market*h.qty,c=h.cost_usd*h.qty;t.val+=v;t.cost+=c;var br=h.buy_fx&&h.buy_fx[S.ccy];if(br)t.fx+=c*(rateNow()-Number(br));t.game[h.game]=(t.game[h.game]||0)+v;});return t;}
  function portfolioSeries(){var hs=S.latest.holdings.filter(ok),dates={};hs.forEach(function(h){series(h.id).forEach(function(p){dates[p[0]]=1})});var ds=Object.keys(dates).sort();var last={};return ds.map(function(d){var sum=0;hs.forEach(function(h){var s=series(h.id);for(var i=0;i<s.length;i++){if(s[i][0]===d){last[h.id]=s[i][1];break;}}if(last[h.id]!=null)sum+=last[h.id]*h.qty;});return [d,sum];});}
  function clip(s){if(S.range==='all'||!s.length)return s;var days={'7':7,'30':30,'90':90}[S.range];var t=new Date(s[s.length-1][0]+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-days);var cut=t.toISOString().slice(0,10);return s.filter(function(p){return p[0]>=cut});}

  // ---------- charts ----------
  function niceTicks(lo,hi,n){if(lo===hi){lo=lo*0.95;hi=hi*1.05||1;}var span=hi-lo,step=Math.pow(10,Math.floor(Math.log10(span/n))),err=span/n/step;if(err>=7.5)step*=10;else if(err>=3.5)step*=5;else if(err>=1.5)step*=2;var a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,out=[];for(var v=a;v<=b+step/2;v+=step)out.push(Math.round(v*1e6)/1e6);return out;}
  function shortUsd(v){var a=Math.abs(v);if(a>=1e6)return '$'+(v/1e6).toFixed(1)+'M';if(a>=1e4)return '$'+(v/1e3).toFixed(0)+'k';if(a>=1e3)return '$'+(v/1e3).toFixed(1)+'k';return '$'+v.toFixed(a<10?2:0);}
  function lineChart(box,data,opts){
    box.innerHTML='';var W=box.clientWidth||600,H=box.clientHeight||200;var ns='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('role','img');svg.setAttribute('aria-label',opts.label||'Fiyat grafiği');
    function mk(t,a){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    var padL=opts.axis?48:4,padR=10,padT=10,padB=opts.axis?24:6;
    if(!data.length){box.appendChild(el('div',{class:'note',text:'Henüz kayıt yok.'}));return;}
    var vals=data.map(function(p){return p[1]}),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
    var ticks=niceTicks(lo,hi,4),y0=ticks[0],y1=ticks[ticks.length-1];
    var t0=Date.parse(data[0][0]),t1=Date.parse(data[data.length-1][0]);if(t1===t0){t0-=864e5;t1+=864e5;}
    var X=function(d){return padL+(Date.parse(d)-t0)/(t1-t0)*(W-padL-padR)},Y=function(v){return padT+(1-(v-y0)/(y1-y0||1))*(H-padT-padB)};
    if(opts.axis){ticks.forEach(function(t){mk('line',{x1:padL,x2:W-padR,y1:Y(t),y2:Y(t),stroke:'var(--line)','stroke-width':1});var tx=mk('text',{x:padL-8,y:Y(t)+4,'text-anchor':'end','font-size':11,fill:'var(--faint)','font-family':'IBM Plex Mono, monospace'});tx.textContent=shortUsd(t);});
      var lbl=[data[0][0],data[data.length-1][0]];if(data.length>2)lbl.splice(1,0,data[Math.floor(data.length/2)][0]);lbl.forEach(function(d,i){var tx=mk('text',{x:X(d),y:H-6,'text-anchor':i===0?'start':(i===lbl.length-1?'end':'middle'),'font-size':11,fill:'var(--faint)'});tx.textContent=dfmt(d).replace(/ \d{4}$/,'');});}
    var col=opts.color||'var(--chart)';
    if(data.length>1){var d='M'+data.map(function(p){return X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)}).join('L');
      mk('path',{d:d+'L'+X(data[data.length-1][0]).toFixed(1)+' '+(H-padB)+'L'+X(data[0][0]).toFixed(1)+' '+(H-padB)+'Z',fill:opts.fill||'var(--chart-fill)',stroke:'none'});
      mk('path',{d:d,fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'});}
    var lp=data[data.length-1];mk('circle',{cx:X(lp[0]),cy:Y(lp[1]),r:4,fill:col,stroke:'var(--surface)','stroke-width':2});
    box.appendChild(svg);
    if(opts.tip){var tip=el('div',{class:'tip'});box.appendChild(tip);var guide=mk('line',{x1:0,x2:0,y1:padT,y2:H-padB,stroke:'var(--faint)','stroke-dasharray':'3 3',opacity:0});var dot=mk('circle',{r:4,fill:col,opacity:0});
      function at(clientX){var r=svg.getBoundingClientRect(),x=(clientX-r.left)*(W/r.width),best=data[0],bd=1e18;data.forEach(function(p){var dd=Math.abs(X(p[0])-x);if(dd<bd){bd=dd;best=p}});return best;}
      function show(ev){var p=at(ev.touches?ev.touches[0].clientX:ev.clientX),r=svg.getBoundingClientRect(),sx=r.width/W;guide.setAttribute('x1',X(p[0]));guide.setAttribute('x2',X(p[0]));guide.setAttribute('opacity',1);dot.setAttribute('cx',X(p[0]));dot.setAttribute('cy',Y(p[1]));dot.setAttribute('opacity',1);tip.textContent=dfmt(p[0])+' · '+usd(p[1])+' · '+sec(p[1]*fxOn(p[0]));tip.style.left=(X(p[0])*sx)+'px';tip.style.top=(Y(p[1])*(r.height/H))+'px';tip.classList.add('on');}
      function hide(){tip.classList.remove('on');guide.setAttribute('opacity',0);dot.setAttribute('opacity',0);}
      svg.addEventListener('mousemove',show);svg.addEventListener('touchmove',show,{passive:true});svg.addEventListener('mouseleave',hide);svg.addEventListener('touchend',hide);}
  }
  function spark(data){var ns='http://www.w3.org/2000/svg',W=92,H=32,svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','spark');svg.setAttribute('aria-hidden','true');

    var v=s.map(function(p){return p[1]}),lo=Math.min.apply(null,v),hi=Math.max.apply(null,v),sp=hi-lo||1,up=v[v.length-1]>=v[0];

  // ---------- render ----------
  function renderCcy(){var seg=document.getElementById('ccySeg');seg.innerHTML='';CCY.forEach(function(m){var b=el('button',{type:'button','aria-pressed':String(S.ccy===m.c),text:m.c});b.onclick=function(){S.ccy=m.c;store.set('kr-ccy',m.c);render();};seg.appendChild(b);});}
  function renderFresh(){var L=S.latest,f=document.getElementById('fresh'),age=(Date.now()-Date.parse(L.generated_at))/864e5;f.classList.toggle('stale',age>2);document.getElementById('freshTxt').textContent='Fiyatlar '+dfmt(L.price_date)+(age>2?' · güncelleme gecikti':'');f.title=L.source+' · son çalışma '+L.generated_at;}

  function render(){

    var alloc=el('div',{class:'alloc'}),lg=el('div',{class:'legend'});

    stats.appendChild(el('div',null,[el('div',{class:'label',text:'Oyun dağılımı',style:'margin-bottom:6px'}),alloc,lg]));

    cp.appendChild(el('div',{class:'chart-head'},[el('h2',{text:'Portföy değeri, USD'}),seg]));
    var cb=el('div',{class:'chart-box'});cp.appendChild(cb);
    var full=portfolioSeries();cp.appendChild(el('div',{class:'note',text:full.length<2?'Fiyat geçmişi bugünden itibaren her gün birikiyor; grafik birkaç gün içinde dolacak.':full.length+' günlük kayıt · noktanın üzerine gel: o günün kuruyla '+S.ccy+' karşılığı'}));
    hero.appendChild(cp);app.appendChild(hero);

    var main=el('section',{class:'main'});
    var led=el('div',{class:'panel ledger'});
    var sortSel=el('select',{id:'sortSel','aria-label':'Sırala'});[['value','Değere göre'],['pl','K/Z yüzdesine göre'],['d7','7 günlük değişime göre'],['name','Ada göre']].forEach(function(o){var op=el('option',{value:o[0],text:o[1]});if(S.sort===o[0])op.selected=true;sortSel.appendChild(op);});

    led.appendChild(el('div',{class:'ledger-head'},[el('h2',{text:'Kartlarım · '+L.holdings.filter(ok).length}),el('label',{class:'sort'},[sortSel])]));

  function renderDossier(hs){

  function desk(h){
    var raw=h.price.market,wrap=el('div',{class:'desk'});
    wrap.appendChild(el('h3',{text:'Grading masası'}));
    wrap.appendChild(el('p',{class:'note',style:'margin:-4px 0 0',text:'Ham fiyat güncel piyasadan gelir. PSA fiyatları ve olasılıklar senin senaryon; PSA verisi sonraki aşamada eklenecek.'}));
    var gr=el('div',{class:'grid'});
    function inp(id,lab,val,ro){var i=el('input',{id:id,type:'number',min:'0',step:'any',value:String(val)});if(ro){i.readOnly=true;i.tabIndex=-1;}gr.appendChild(el('label',{for:id},[lab,i]));return i;}
    var key='kr-desk-'+h.id,saved={};try{saved=JSON.parse(store.get(key)||'{}')}catch(e){}
    var iRaw=inp('gRaw','Ham fiyat $ (piyasa)',raw.toFixed(2),true),iFee=inp('gFee','Grading + kargo $',saved.fee!=null?saved.fee:45);
    var i10=inp('g10','PSA 10 fiyatı $',saved.g10!=null?saved.g10:(raw*3).toFixed(2)),ip10=inp('p10','PSA 10 olasılığı %',saved.p10!=null?saved.p10:35);
    var i9=inp('g9','PSA 9 fiyatı $',saved.g9!=null?saved.g9:(raw*1.3).toFixed(2)),ip9=inp('p9','PSA 9 olasılığı %',saved.p9!=null?saved.p9:45);
    var i8=inp('g8','PSA 8 ve altı $',saved.g8!=null?saved.g8:(raw*0.85).toFixed(2)),ip8=inp('p8','PSA 8 ve altı %','',true);
    wrap.appendChild(gr);var v=el('div',{class:'verdict','aria-live':'polite'});wrap.appendChild(v);
    function n(i){var x=parseFloat(i.value);return isFinite(x)?x:0;}
    function calc(){var p10=Math.min(1,n(ip10)/100),p9=Math.min(1-p10,n(ip9)/100),p8=Math.max(0,1-p10-p9);ip8.value=(p8*100).toFixed(0);
      var ev=p10*n(i10)+p9*n(i9)+p8*n(i8),gain=ev-raw-n(iFee),den=n(i10)-n(i8),be=den>0?(raw+n(iFee)-p9*n(i9)-(1-p9)*n(i8))/den*100:NaN,go=gain>0;
      v.className='verdict '+(go?'go':'no');v.innerHTML='';
      v.appendChild(el('div',{class:'kv'},[el('span',{class:'label',text:'Beklenen kazanç'}),el('strong',{class:go?'pos':'neg',text:go?'Grade ettir':'Ham sat'})]));
      v.appendChild(el('div',{class:'big num '+cls(gain),text:usd(gain,true)}));
      v.appendChild(el('div',{class:'kv'},[el('span',{class:'muted',text:'Beklenen satış değeri'}),el('span',{class:'num',text:usd(ev)})]));
      v.appendChild(el('div',{class:'kv'},[el('span',{class:'muted',text:'Ham fiyat + masraf'}),el('span',{class:'num',text:usd(raw+n(iFee))})]));
      v.appendChild(el('div',{class:'kv'},[el('span',{class:'muted',text:'Başa baş PSA 10 olasılığı'}),el('span',{class:'num',text:isFinite(be)?(be<0?'%0':(be>100?'%100 üstü':'%'+be.toFixed(0))):'—'})]));
      store.set(key,JSON.stringify({fee:iFee.value,g10:i10.value,p10:ip10.value,g9:i9.value,p9:ip9.value,g8:i8.value}));}
    [iFee,i10,ip10,i9,ip9,i8].forEach(function(i){i.addEventListener('input',calc)});calc();return wrap;
  }

  function fail(msg){document.getElementById('app').innerHTML='';document.getElementById('app').appendChild(el('div',{class:'panel empty',style:'margin-top:20px'},[el('h2',{text:'İlk günlük kayıt bekleniyor'}),el('p',{text:msg})]));document.getElementById('freshTxt').textContent='Veri yok';document.getElementById('fresh').classList.add('stale');renderCcy();}

  Promise.all([fetch('data/latest.json'+bust).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}),fetch('data/history.json'+bust).then(function(r){return r.ok?r.json():{prices:{},fx:[]}}).catch(function(){return {prices:{},fx:[]}})])

    .catch(function(){fail('Günlük görev henüz çalışmadı ya da veri dosyası okunamadı. Görev her gün 09:23 (Türkiye saati) çalışır.');});
})();

name: PSA fiyat ve eşleştirme görevi

on:
  schedule:
    # 15 dakikada bir: yeni eklenen kartlar kısa sürede eşleşip fiyatlanır.
    # Yapılacak iş yoksa görev kredi harcamadan biter (GitHub zamanlamayı birkaç dakika geciktirebilir).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/sync_psa.py"
      - ".github/workflows/psa-sync.yml"

permissions:
  contents: write

concurrency:
  group: psa-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Eşleştir, fiyatla, kurları güncelle
        env:
          SUPABASE_URL: https://bsifvfcnktofugaspsls.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PPT_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
          PSA_TOKEN: ${{ secrets.PSA_API_TOKEN }}
          STATUS_FILE: ${{ runner.temp }}/status.json
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # PokemonPriceTracker API planı (günde 20.000 kredi). Ücretsiz plana dönülürse: 95 / 3 / 0
          PPT_DAILY_BUDGET: "15000"
          PPT_SEARCH_LIMIT: "10"
          PPT_HISTORY_DAYS: "180"
        run: python pipeline/sync_psa.py

      - name: Çalışma özetini 'status' dalına yaz (yalnızca sayılar ve hata mesajları)
        if: always()
        run: |
          f="${{ runner.temp }}/status.json"
          [ -f "$f" ] || exit 0
          d=$(mktemp -d); cp "$f" "$d/status.json"; cd "$d"
          git init -q -b status && git add status.json
          git -c user.name="kartradari-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Çalışma özeti $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status

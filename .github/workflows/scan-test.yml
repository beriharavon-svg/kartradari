name: Kart tarayıcı testi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/scan.js"
      - "tools/scan_test.mjs"
      - ".github/workflows/scan-test.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Tarayıcıyı gerçek kart görselleriyle dene
        env:
          OUT: ${{ runner.temp }}/scan.json
        run: node tools/scan_test.mjs
      - name: Sonucu 'status-scan' dalına yaz
        if: always()
        run: |
          f="${{ runner.temp }}/scan.json"; [ -f "$f" ] || exit 0
          d=$(mktemp -d); cp "$f" "$d/scan.json"; cd "$d"
          git init -q -b status-scan && git add scan.json
          git -c user.name="kartradari-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Tarayıcı testi $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status-scan

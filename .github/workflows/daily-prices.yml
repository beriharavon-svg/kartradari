name: Eski örnek panel (TCGCSV)

on:
  # Eski örnek panel için TCGCSV ham fiyat görevi. Artık yalnızca elle çalıştırılır.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fiyatları ve kurları çek
        run: python pipeline/fetch_prices.py

      - name: Kaydı repoya işle
        run: |
          git config user.name "kartradari-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data pipeline/cache
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Günlük fiyat kaydı $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

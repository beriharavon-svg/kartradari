name: Günlük fiyat kaydı

on:
  schedule:
    # Her gün 06:23 UTC (09:23 Türkiye saati)
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/daily-prices.yml"

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fiyatları ve kurları çek
        run: python pipeline/fetch_prices.py

      - name: Kaydı repoya işle
        run: |
          git config user.name "kartradari-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data pipeline/cache
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Günlük fiyat kaydı $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

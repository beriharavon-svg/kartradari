name: PSA fiyat kaynağı testi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/ppt_probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API'yi dene
        env:
          PPT_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
        run: python tools/ppt_probe.py
      - name: Sonucu kaydet
        run: |
          git config user.name "kartradari-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/out
          git diff --cached --quiet || (git commit -m "PSA kaynak testi sonucu" && git pull --rebase origin main && git push)
